[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Functions take precedence over the SPA fallback below thanks to the explicit
# rule for /api/chat → the chat function (also accessible at the default
# /.netlify/functions/chat path).
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

# Supabase proxy: forwards every /sb/* request through Netlify to the
# Supabase project. Lets desktops where antivirus / endpoint protection /
# corporate firewalls block POSTs to *.supabase.co still reach the API —
# the browser only sees ci-tech-showcase.netlify.app traffic.
# status 200 + force=true makes this a true proxy, not an HTTP redirect.
[[redirects]]
  from = "/sb/*"
  to = "https://toavzjaxknzrwgaggnck.supabase.co/:splat"
  status = 200
  force = true

# SPA fallback so client-side routes (deep links like /admin, /project/:id)
# resolve to index.html instead of 404ing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
